name: 06 - Contexts
on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
run-name: 06 - Contexts | DEBUG - ${{ inputs.debug }}
env:
  MY_WORKFLOW_VAR: workflow
  MY_OVERWRITTEN_VAR: workflow

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Display Information
        run: echo event name - ${{ github.event_name }} ref - ${{ github.ref }} sha - ${{ github.sha }} actor - ${{ github.actor }} ${{ github.workflow }} ${{ github.run_id }} ${{ github.run_number }}

      - name: Retrieve Variable
        run: echo ${{ vars.MY_VAR }}

      - name: Print Env Variables
        env:
          MY_OVERWRITTEN_VAR: step
        run: |
          echo Workflow env: $MY_WORKFLOW_VAR
          echo Overwritten env: $MY_OVERWRITTEN_VAR

      - name: Print Env Variables
        run: |
          echo Workflow env: $MY_WORKFLOW_VAR
          echo Overwritten env: $MY_OVERWRITTEN_VAR
